global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "memesee-gateway-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]
        labels:
          service: "gateway-service"

  - job_name: "memesee-user-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]
        labels:
          service: "user-service"

  - job_name: "memesee-content-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["content-service:8083"]
        labels:
          service: "content-service"

  - job_name: "memesee-media-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["media-worker:8088"]
        labels:
          service: "media-worker"

  - job_name: "memesee-otel-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: "otel-collector"
