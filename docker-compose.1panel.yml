name: memesee

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_APP_USERNAME: ${MYSQL_APP_USERNAME:-memesee_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7.4}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-memesee}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CONTENT_MEDIA_MINIO_BUCKET: ${CONTENT_MEDIA_MINIO_BUCKET:-memesee-post-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$CONTENT_MEDIA_MINIO_BUCKET"
        mc anonymous set download "local/$$CONTENT_MEDIA_MINIO_BUCKET"
    restart: "no"

  meilisearch:
    image: ${MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.12}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    ports:
      - "127.0.0.1:${MEILI_HOST_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.128.0}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_HTTP_HOST_PORT:-4318}:4318"
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol/config.yml:ro
    security_opt:
      - no-new-privileges:true

  user-service:
    image: ${MEMESEE_IMAGE_REGISTRY:-ghcr.io/douziao}/memesee-user-service:${MEMESEE_VERSION:?set MEMESEE_VERSION in .env}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-user-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      USER_DB_URL: jdbc:mysql://mysql:3306/memesee_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      USER_DB_USERNAME: ${MYSQL_APP_USERNAME:-memesee_app}
      USER_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      USER_DB_POOL_MAX_SIZE: ${USER_DB_POOL_MAX_SIZE:-10}
      USER_DB_POOL_MIN_IDLE: ${USER_DB_POOL_MIN_IDLE:-2}
      USER_DB_POOL_CONNECTION_TIMEOUT_MS: ${USER_DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      USER_DB_POOL_VALIDATION_TIMEOUT_MS: ${USER_DB_POOL_VALIDATION_TIMEOUT_MS:-1000}
      USER_DB_POOL_IDLE_TIMEOUT_MS: ${USER_DB_POOL_IDLE_TIMEOUT_MS:-600000}
      USER_DB_POOL_MAX_LIFETIME_MS: ${USER_DB_POOL_MAX_LIFETIME_MS:-1800000}
      USER_SHUTDOWN_TIMEOUT: ${USER_SHUTDOWN_TIMEOUT:-20s}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?set APP_SECURITY_JWT_SECRET in .env}
      APP_SECURITY_JWT_EXPIRATION_SECONDS: ${APP_SECURITY_JWT_EXPIRATION_SECONDS:-86400}
      APP_SECURITY_INTERNAL_SERVICE_TOKEN: ${APP_SECURITY_INTERNAL_SERVICE_TOKEN:?set APP_SECURITY_INTERNAL_SERVICE_TOKEN in .env}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-true}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
    expose:
      - "8081"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  content-service:
    image: ${MEMESEE_IMAGE_REGISTRY:-ghcr.io/douziao}/memesee-content-service:${MEMESEE_VERSION:?set MEMESEE_VERSION in .env}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-content-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy
      user-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONTENT_DB_URL: jdbc:mysql://mysql:3306/memesee_content?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CONTENT_DB_USERNAME: ${MYSQL_APP_USERNAME:-memesee_app}
      CONTENT_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      CONTENT_DB_POOL_MAX_SIZE: ${CONTENT_DB_POOL_MAX_SIZE:-20}
      CONTENT_DB_POOL_MIN_IDLE: ${CONTENT_DB_POOL_MIN_IDLE:-5}
      CONTENT_DB_POOL_CONNECTION_TIMEOUT_MS: ${CONTENT_DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
      CONTENT_DB_POOL_VALIDATION_TIMEOUT_MS: ${CONTENT_DB_POOL_VALIDATION_TIMEOUT_MS:-1000}
      CONTENT_DB_POOL_IDLE_TIMEOUT_MS: ${CONTENT_DB_POOL_IDLE_TIMEOUT_MS:-600000}
      CONTENT_DB_POOL_MAX_LIFETIME_MS: ${CONTENT_DB_POOL_MAX_LIFETIME_MS:-1800000}
      CONTENT_SHUTDOWN_TIMEOUT: ${CONTENT_SHUTDOWN_TIMEOUT:-20s}
      CONTENT_PROJECTION_QUERY_SLOW_THRESHOLD: ${CONTENT_PROJECTION_QUERY_SLOW_THRESHOLD:-250ms}
      MEMESEE_REDIS_HOST: redis
      MEMESEE_REDIS_PORT: 6379
      MEMESEE_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      MEMESEE_RABBITMQ_HOST: rabbitmq
      MEMESEE_RABBITMQ_PORT: 5672
      MEMESEE_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-memesee}
      MEMESEE_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      USER_SERVICE_URL: http://user-service:8081
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:?set APP_SECURITY_JWT_SECRET in .env}
      APP_SECURITY_INTERNAL_SERVICE_TOKEN: ${APP_SECURITY_INTERNAL_SERVICE_TOKEN:?set APP_SECURITY_INTERNAL_SERVICE_TOKEN in .env}
      CONTENT_SEARCH_MEILISEARCH_URL: http://meilisearch:7700
      CONTENT_SEARCH_MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      CONTENT_MEDIA_MINIO_ENDPOINT: http://minio:9000
      CONTENT_MEDIA_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      CONTENT_MEDIA_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      CONTENT_MEDIA_MINIO_BUCKET: ${CONTENT_MEDIA_MINIO_BUCKET:-memesee-post-images}
      CONTENT_MEDIA_PROCESSING_ASYNC_ENABLED: ${CONTENT_MEDIA_PROCESSING_ASYNC_ENABLED:-true}
      CONTENT_MEDIA_DIRECT_DELIVERY_ENABLED: ${CONTENT_MEDIA_DIRECT_DELIVERY_ENABLED:-true}
      CONTENT_MEDIA_PUBLIC_BASE_URL: ${CONTENT_MEDIA_PUBLIC_BASE_URL:-https://memesee.world/media}
      CONTENT_MEDIA_MAX_BYTES: ${CONTENT_MEDIA_MAX_BYTES:-20971520}
      CONTENT_OUTBOX_PROCESSOR_DISTRIBUTED_LOCK_ENABLED: ${CONTENT_OUTBOX_PROCESSOR_DISTRIBUTED_LOCK_ENABLED:-true}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-true}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
    expose:
      - "8083"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  media-worker:
    image: ${MEMESEE_IMAGE_REGISTRY:-ghcr.io/douziao}/memesee-media-worker:${MEMESEE_VERSION:?set MEMESEE_VERSION in .env}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-media-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      content-service:
        condition: service_healthy
    environment:
      MEDIA_WORKER_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-memesee}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672
      MEDIA_WORKER_EXCHANGE: ${CONTENT_MEDIA_PROCESSING_EXCHANGE:-memesee.media}
      MEDIA_WORKER_QUEUE: ${CONTENT_MEDIA_PROCESSING_QUEUE:-memesee.media.variant-processing}
      MEDIA_WORKER_ROUTING_KEY: ${CONTENT_MEDIA_PROCESSING_ROUTING_KEY:-media.variant.process}
      MEDIA_WORKER_DEAD_LETTER_EXCHANGE: ${CONTENT_MEDIA_PROCESSING_DLX:-memesee.media.dlx}
      MEDIA_WORKER_DEAD_LETTER_QUEUE: ${CONTENT_MEDIA_PROCESSING_DLQ:-memesee.media.variant-processing.dlq}
      MEDIA_WORKER_DEAD_LETTER_ROUTING_KEY: ${CONTENT_MEDIA_PROCESSING_DLQ_ROUTING_KEY:-media.variant.process.dead}
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
      MEDIA_WORKER_HEALTH_PORT: ${MEDIA_WORKER_HEALTH_PORT:-8088}
      MEDIA_WORKER_DB_POOL: ${MEDIA_WORKER_DB_POOL:-5}
      MEDIA_WORKER_DB_HOST: mysql
      MEDIA_WORKER_DB_PORT: 3306
      MEDIA_WORKER_DB_NAME: memesee_content
      MEDIA_WORKER_DB_USERNAME: ${MYSQL_APP_USERNAME:-memesee_app}
      MEDIA_WORKER_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      MEDIA_WORKER_MINIO_ENDPOINT: minio
      MEDIA_WORKER_MINIO_PORT: 9000
      MEDIA_WORKER_MINIO_USE_SSL: "false"
      MEDIA_WORKER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MEDIA_WORKER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MEDIA_WORKER_MINIO_BUCKET: ${CONTENT_MEDIA_MINIO_BUCKET:-memesee-post-images}
      MEDIA_WORKER_PUBLIC_BASE_URL: ${CONTENT_MEDIA_PUBLIC_BASE_URL:-https://memesee.world/media}
      MEDIA_WORKER_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.MEDIA_WORKER_HEALTH_PORT || '8088') + '/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway-service:
    image: ${MEMESEE_IMAGE_REGISTRY:-ghcr.io/douziao}/memesee-gateway-service:${MEMESEE_VERSION:?set MEMESEE_VERSION in .env}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-gateway-service
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      USER_SERVICE_URL: http://user-service:8081
      CONTENT_SERVICE_URL: http://content-service:8083
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://memesee.world}
      GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS:-3000}
      GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:-30s}
      GATEWAY_RETRY_RETRIES: ${GATEWAY_RETRY_RETRIES:-1}
      GATEWAY_RETRY_FIRST_BACKOFF: ${GATEWAY_RETRY_FIRST_BACKOFF:-50ms}
      GATEWAY_RETRY_MAX_BACKOFF: ${GATEWAY_RETRY_MAX_BACKOFF:-250ms}
      GATEWAY_RETRY_BACKOFF_FACTOR: ${GATEWAY_RETRY_BACKOFF_FACTOR:-2}
      GATEWAY_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${GATEWAY_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-50}
      GATEWAY_CIRCUIT_BREAKER_MINIMUM_CALLS: ${GATEWAY_CIRCUIT_BREAKER_MINIMUM_CALLS:-10}
      GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${GATEWAY_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      GATEWAY_CIRCUIT_BREAKER_OPEN_STATE_WAIT: ${GATEWAY_CIRCUIT_BREAKER_OPEN_STATE_WAIT:-10s}
      GATEWAY_CIRCUIT_BREAKER_HALF_OPEN_CALLS: ${GATEWAY_CIRCUIT_BREAKER_HALF_OPEN_CALLS:-5}
      GATEWAY_CIRCUIT_BREAKER_TIMEOUT: ${GATEWAY_CIRCUIT_BREAKER_TIMEOUT:-5s}
      GATEWAY_SHUTDOWN_TIMEOUT: ${GATEWAY_SHUTDOWN_TIMEOUT:-20s}
      MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-true}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-prometheus
    restart: unless-stopped
    depends_on:
      gateway-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      media-worker:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: ${MEMESEE_IMAGE_REGISTRY:-ghcr.io/douziao}/memesee-frontend:${MEMESEE_VERSION:?set MEMESEE_VERSION in .env}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-memesee}-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  meilisearch-data:
  prometheus-data:
