name: Publish Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-service
            context: backend
            dockerfile: backend/Dockerfile
            build_args: SERVICE=user-service
          - image: content-service
            context: backend
            dockerfile: backend/Dockerfile
            build_args: SERVICE=content-service
          - image: gateway-service
            context: backend
            dockerfile: backend/Dockerfile
            build_args: SERVICE=gateway-service
          - image: media-worker
            context: media-worker
            dockerfile: media-worker/Dockerfile
            build_args: ""
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: VITE_API_BASE=

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/douziao/memesee-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
